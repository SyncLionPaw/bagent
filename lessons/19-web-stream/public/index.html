<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>流式聊天 · 第 19 课</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; font-family: system-ui, sans-serif; font-size: 15px;
      background: #f0f2f5; color: #1a1a1a; display: flex; flex-direction: column;
    }
    .key-row {
      display: flex; gap: 8px; padding: 10px 16px; background: #fff; border-bottom: 1px solid #e2e5ea;
    }
    .key-row input {
      flex: 1; padding: 8px 12px; border: 1px solid #d0d5dd; border-radius: 8px; font: inherit;
    }
    .log {
      flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px;
    }
    .msg {
      max-width: min(85%, 28rem); padding: 10px 14px; line-height: 1.5;
      white-space: pre-wrap; word-break: break-word; border-radius: 16px;
    }
    .msg.user {
      align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 4px;
    }
    .msg.assistant {
      align-self: flex-start; max-width: min(92%, 42rem); background: #fff;
      border: 1px solid #e2e5ea; border-bottom-left-radius: 4px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }
    .msg.error {
      align-self: flex-start; background: #fde8e8; color: #9b1c1c; border: 1px solid #f5c2c2;
    }
    .composer {
      display: flex; gap: 8px; padding: 12px 16px; background: #fff; border-top: 1px solid #e2e5ea;
    }
    .composer input {
      flex: 1; padding: 10px 12px; border: 1px solid #d0d5dd; border-radius: 20px;
      font: inherit; background: #f9fafb;
    }
    .composer input:focus { outline: none; border-color: #2563eb; background: #fff; }
    .composer button {
      padding: 10px 16px; border: none; border-radius: 20px; font: inherit; font-weight: 500;
      background: #2563eb; color: #fff; cursor: pointer;
    }
    .composer button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="key-row">
    <input id="apiKey" type="password" placeholder="DeepSeek API Key（仅本页 sessionStorage）" autocomplete="off" />
  </div>
  <main id="log" class="log" aria-live="polite"></main>
  <form id="form" class="composer">
    <input id="input" type="text" placeholder="输入消息…" autocomplete="off" />
    <button type="submit" id="send">发送</button>
  </form>
  <script type="module">
    const KEY = "bagent-deepseek-key";
    const apiKeyEl = document.getElementById("apiKey");
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");

    apiKeyEl.value = sessionStorage.getItem(KEY) ?? "";
    apiKeyEl.addEventListener("change", () => {
      sessionStorage.setItem(KEY, apiKeyEl.value.trim());
    });

    const messages = [{ role: "system", content: "简洁回答用户。" }];
    let busy = false;

    function bubble(text, className) {
      const el = document.createElement("div");
      el.className = "msg " + className;
      el.textContent = text;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return el;
    }

    async function consumeSSE(res, onUpdate) {
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = "", reply = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split("\n");
        buf = lines.pop() ?? "";
        for (const line of lines) {
          if (!line.startsWith("data: ")) continue;
          const data = line.slice(6).trim();
          if (data === "[DONE]") continue;
          const piece = JSON.parse(data).choices?.[0]?.delta?.content;
          if (piece) { reply += piece; onUpdate(reply); }
        }
      }
      return reply;
    }

    async function chat(userText) {
      const key = apiKeyEl.value.trim();
      if (!key) throw new Error("请先填写 API Key");

      messages.push({ role: "user", content: userText });
      sessionStorage.setItem(KEY, key);
      bubble(userText, "user");

      const assistant = bubble("", "assistant");
      sendBtn.disabled = true;
      busy = true;

      try {
        const res = await fetch("https://api.deepseek.com/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${key}`,
          },
          body: JSON.stringify({
            model: "deepseek-v4-flash",
            messages,
            stream: true,
            thinking: { type: "disabled" },
          }),
        });

        if (!res.ok) {
          const err = await res.text();
          messages.pop();
          assistant.remove();
          bubble(err, "error");
          return;
        }

        const reply = await consumeSSE(res, (full) => {
          assistant.textContent = full;
          log.scrollTop = log.scrollHeight;
        });
        messages.push({ role: "assistant", content: reply });
      } catch (err) {
        messages.pop();
        assistant.remove();
        bubble(String(err.message), "error");
      } finally {
        sendBtn.disabled = false;
        busy = false;
        input.focus();
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || busy) return;
      input.value = "";
      chat(text);
    });
    input.focus();
  </script>
</body>
</html>
